<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidewater front desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2a30;--ink-2:#4a6168;--mute:#8aa0a6;--teal:#0e7c86;--teal-d:#0a5f67;--teal-soft:#e2f1f2;--bg:#eef4f4;--card:#fff;--danger:#b4380c;--line:rgba(15,42,48,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);font-family:"Figtree",system-ui,-apple-system,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px 16px 72px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
.frame{position:relative;width:min(980px,100%);min-height:560px;background:#f9fbfb;border-radius:20px;box-shadow:0 0 0 1px var(--line),0 24px 60px -24px rgba(15,42,48,.28);overflow:hidden}
.bar{display:flex;align-items:center;gap:28px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo svg{width:24px;height:24px}
.bar nav{display:flex;gap:20px;color:var(--ink-2);font-size:14px;font-weight:500;flex:1}
.bar nav .on{color:var(--ink);font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--teal-soft);color:var(--teal-d);display:grid;place-items:center;font-size:12px;font-weight:700}
.body{padding:26px 28px 32px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px}
.head h1{margin:0;font-size:26px;letter-spacing:-.02em}
.head p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.replay{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;border:0;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(15,42,48,.08);font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.replay svg{width:14px;height:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:520px){.bar nav{display:none}.bar{justify-content:space-between}.body{padding:18px 14px 24px}.head h1{font-size:21px}.frame{min-height:0}}

.panel{max-width:560px;margin:0 auto}
.add{display:flex;gap:10px;margin-bottom:16px}
.add input{flex:1;min-width:0;height:44px;border-radius:11px;border:0;padding:0 14px;font:inherit;font-size:15px;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--ink);outline:0}
.add input:focus-visible,.add input.typing{box-shadow:0 0 0 2px var(--teal)}
.addbtn{height:44px;padding:0 18px;border:0;border-radius:11px;background:var(--teal);color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 1px 2px rgba(10,95,103,.4),inset 0 1px 0 rgba(255,255,255,.18)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px;min-height:268px;align-content:start}
.task{position:relative;display:flex;align-items:center;gap:12px;padding:0 8px 0 14px;min-height:50px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.cb{position:relative;flex:none;width:22px;height:22px;border-radius:7px;border:0;padding:0;background:#fff;box-shadow:inset 0 0 0 1.5px #b7c8cc}
.cb svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.label{position:relative;flex:1;font-size:15px;min-width:0}
.rm{flex:none;width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center}
.rm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.count{color:var(--ink-2);font-size:13.5px;margin-top:2px}

/* ---- motion ---- */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
.addbtn{transition:transform 160ms var(--ease-out),background-color 160ms ease}
.addbtn:active,.addbtn.pressed{transform:scale(.97)}
.task{opacity:1;transform:none;
  transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out);
  @starting-style{opacity:0;transform:translateY(8px)}}
/* exit is faster than enter, and short: 150ms */
.task[data-leaving]{opacity:0;transform:translateX(12px);transition-duration:150ms}
.cb{transition:background-color 160ms ease,box-shadow 160ms ease}
.cb svg{clip-path:inset(0 100% 0 0);transition:clip-path 160ms var(--ease-out)}
.task[data-done] .cb{background:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.task[data-done] .cb svg{clip-path:inset(0 0 0 0)}
.text{position:relative;display:inline-block;transition:color 200ms ease}
.text::after{content:"";position:absolute;left:0;right:0;top:56%;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left center;transition:transform 200ms var(--ease-out)}
.task[data-done] .text{color:var(--mute)}
.task[data-done] .text::after{transform:scaleX(1)}
.rm{transition:background-color 100ms ease}
.add input.typing{box-shadow:0 0 0 2px var(--teal)}
@media(hover:hover) and (pointer:fine){.rm:hover{background:rgba(15,42,48,.07)}}
@media(prefers-reduced-motion:reduce){.task,.task[data-leaving]{transform:none}.task{@starting-style{opacity:0;transform:none}}.text::after{transition:none}.addbtn:active,.addbtn.pressed{transform:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h16M7.5 3.5v3M16.5 3.5v3M5.5 5.5h13A1.5 1.5 0 0 1 20 7v11.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5V7a1.5 1.5 0 0 1 1.5-1.5Z"/></symbol><symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol><symbol id="i-dup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></symbol><symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15L6 16.5ZM10 20.5h4"/></symbol><symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m9 9 6 6m0-6-6 6"/></symbol><symbol id="i-dots" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="18.5" cy="12" r=".6"/></symbol><symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11m0-11-11 11"/></symbol><symbol id="i-replay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5M4.5 4.5v4h4"/></symbol></svg>
<main class="frame">
<header class="bar"><span class="logo"><svg viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="7" fill="#0e7c86"/><path d="M4.5 13.5c2-3 3.7-3 5.5 0s3.5 3 5.5 0 3-2.5 4-1.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>Tidewater</span><nav><span>Schedule</span><span>Patients</span><span class="on">Front desk</span></nav><span class="avatar">DO</span></header>
<div class="body"><div class="panel">
<div class="head"><div><h1>Front desk tasks</h1><p class="count" id="count">&nbsp;</p></div></div>
<div class="add"><input id="inp" placeholder="Add a task" aria-label="New task" readonly><button class="addbtn" id="addbtn" type="button">Add</button></div>
<ul class="tasks" id="tasks"></ul>
</div></div>


</main>
<button class="replay" id="replay" type="button"><svg><use href="#i-replay"/></svg>Replay</button>
<script>

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let run=0;

const list=$('#tasks'),inp=$('#inp'),addbtn=$('#addbtn'),count=$('#count');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const names=['Confirm Tue 10:30 with Maya Chen','Send intake forms to Ines Duarte','Reorder resistance bands'];
function updateCount(){const all=list.querySelectorAll('.task:not([data-leaving])'),done=list.querySelectorAll('.task[data-done]:not([data-leaving])');count.textContent=all.length?done.length+' of '+all.length+' done':'Nothing queued';}
function makeTask(text){
  const li=document.createElement('li');li.className='task';
  li.innerHTML='<button class="cb" type="button" aria-pressed="false" aria-label="Mark done"><svg viewBox="0 0 22 22"><path d="M6 11.5l3.2 3.2L16 7.8"/></svg></button><span class="label"><span class="text"></span></span><button class="rm" type="button" aria-label="Remove task"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9m0-9l-9 9"/></svg></button>';
  li.querySelector('.text').textContent=text;
  li.querySelector('.cb').onclick=()=>toggle(li);
  li.querySelector('.rm').onclick=()=>remove(li);
  return li;
}
function toggle(li){const d=li.toggleAttribute('data-done');li.querySelector('.cb').setAttribute('aria-pressed',d);updateCount();}
// FLIP with WAAPI: siblings glide into the gap using transform only
function remove(li){
  if(li.hasAttribute('data-leaving'))return;
  li.setAttribute('data-leaving','');updateCount();
  setTimeout(()=>{
    const sibs=[...list.children].filter(x=>x!==li);
    const before=new Map(sibs.map(x=>[x,x.getBoundingClientRect().top]));
    li.remove();
    if(reduce)return;
    sibs.forEach(x=>{const dy=before.get(x)-x.getBoundingClientRect().top;
      if(dy)x.animate([{transform:'translateY('+dy+'px)'},{transform:'none'}],{duration:220,easing:'cubic-bezier(0.77,0,0.175,1)'});});
  },150);
}
async function type(my,text){
  inp.classList.add('typing');inp.value='';
  for(const ch of text){inp.value+=ch;await sleep(22);if(my!==run)return false;}
  return true;
}
async function play(){
  const my=++run, ok=async ms=>{await sleep(ms);return my===run};
  list.innerHTML='';inp.value='';inp.classList.remove('typing');updateCount();
  while(my===run){
    if(!await ok(700))return;
    for(const n of names){
      if(!await type(my,n))return;
      if(!await ok(150))return;
      addbtn.classList.add('pressed');if(!await ok(140))return;addbtn.classList.remove('pressed');
      inp.value='';inp.classList.remove('typing');
      list.append(makeTask(n));updateCount();
      if(!await ok(450))return;
    }
    if(!await ok(500))return;
    toggle(list.children[0]);if(!await ok(900))return;
    toggle(list.children[1]);if(!await ok(1000))return;
    remove(list.children[0]);if(!await ok(1000))return;
    remove(list.children[0]);if(!await ok(900))return;
    remove(list.children[0]);if(!await ok(1600))return;
  }
}
$('#replay').onclick=play;play();
</script>
</body></html>
