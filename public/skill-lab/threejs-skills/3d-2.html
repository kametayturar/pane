<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater – every appointment in place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1d21;--ink:#eef7f6;--muted:#9bb8bb;--teal:#35b3a8;--line:rgba(255,255,255,.14)}
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:auto}
  body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 50% 48%,rgba(11,29,33,.55),rgba(11,29,33,0) 70%),linear-gradient(180deg,rgba(11,29,33,.55),rgba(11,29,33,0) 22%,rgba(11,29,33,0) 80%,rgba(11,29,33,.7))}
  nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:24px 40px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
  .brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0e7c86,var(--teal));display:grid;place-items:center}
  .brand svg{width:18px;height:18px}
  nav a{font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:9px 16px;border-radius:99px;backdrop-filter:blur(6px)}
  .track{position:relative;z-index:2;height:320vh}
  .pin{position:sticky;top:0;height:100vh;display:grid;place-items:center;text-align:center;padding:0 24px}
  .words{max-width:1000px}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:20px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(42px,7.4vw,104px);line-height:1;letter-spacing:-.03em;text-wrap:balance}
  h1 span{display:inline-block;will-change:transform,opacity,filter}
  .sub{margin:26px auto 0;max-width:34em;font-size:clamp(16px,1.6vw,20px);line-height:1.55;color:var(--muted)}
  .cta{margin-top:30px;display:inline-block;font:600 15px "DM Sans",sans-serif;padding:14px 24px;border-radius:12px;background:var(--teal);color:#06201f;text-decoration:none}
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
  .hint i{width:1px;height:26px;background:linear-gradient(var(--muted),transparent);display:block}
  .meter{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-end;font-size:12px;color:var(--muted)}
  .meter b{display:block;font-size:22px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  @media (max-width:640px){nav{padding:18px 20px}.meter{display:none}}
</style>
</head>
<body>
<nav><div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 9c3-3 5-3 9 0s6 3 9 0M3 15c3-3 5-3 9 0s6 3 9 0"/></svg></i>Tidewater</div><a href="#">Book a demo</a></nav>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="veil"></div>
<div class="meter" aria-hidden="true"><div>in place<b id="pct">0%</b></div></div>
<main class="track" id="track">
  <section class="pin">
    <div class="words">
      <div class="kicker">Tidewater · scheduling for physiotherapy</div>
      <h1 id="h1" aria-label="Every appointment, in its place"><span>Every</span> <span>appointment,</span> <span>in</span> <span>its</span> <span>place</span></h1>
      <p class="sub">Drifting bookings, double entries and open gaps settle into one calm week.</p>
      <a class="cta" href="#">Start free for 14 days</a>
    </div>
  </section>
</main>
<div class="hint" aria-hidden="true"><i></i>Scroll</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { Timer } from "three/addons/misc/Timer.js";

const canvas = document.getElementById("gl");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0b1d21, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1d21, 0.035);
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 80);

// ---- target layout: a week of appointment slots (5 columns x 8 rows of small clusters) ----
const COLS = 5, ROWS = 8, PER = 60;                       // particles per slot cluster
const COUNT = COLS * ROWS * PER;
const gridW = 9.2, gridH = 5.6;
const target = new Float32Array(COUNT * 3), start = new Float32Array(COUNT * 3), current = new Float32Array(COUNT * 3);
const delay = new Float32Array(COUNT), seed = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);
const palette = [new THREE.Color(0x35b3a8), new THREE.Color(0x7fd8d0), new THREE.Color(0xf2e2c4), new THREE.Color(0x0e7c86)];
let k = 0;
for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
  // each slot is a short rounded bar; some slots are 'longer' appointments
  const long = ((c * 7 + r * 3) % 5) === 0;
  const cx = (c / (COLS - 1) - 0.5) * gridW, cy = (0.5 - r / (ROWS - 1)) * gridH;
  const col = palette[(c + r * 2) % palette.length];
  for (let i = 0; i < PER; i++, k++) {
    const u = (i / (PER - 1) - 0.5), w = long ? 1.4 : 0.92;
    target[k * 3] = cx + u * w; target[k * 3 + 1] = cy + (Math.random() - 0.5) * 0.24; target[k * 3 + 2] = (Math.random() - 0.5) * 0.05;
    // scattered start: a loose swirl cloud in front of the grid
    const a = Math.random() * Math.PI * 2, rad = 3 + Math.random() * 9;
    start[k * 3] = Math.cos(a) * rad * 1.3; start[k * 3 + 1] = (Math.random() - 0.5) * 9; start[k * 3 + 2] = (Math.random() - 0.3) * 14;
    seed[k * 3] = Math.random() * 6.283; seed[k * 3 + 1] = 0.4 + Math.random() * 0.9; seed[k * 3 + 2] = Math.random();
    delay[k] = (c / COLS * 0.35 + r / ROWS * 0.25) + Math.random() * 0.2;     // staggered settle
    colors[k * 3] = col.r; colors[k * 3 + 1] = col.g; colors[k * 3 + 2] = col.b;
  }
}
current.set(start);

const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(current, 3).setUsage(THREE.DynamicDrawUsage));
geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

// soft round sprite, drawn once on a canvas
const sprite = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(0.35, "rgba(255,255,255,.85)"); grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const material = new THREE.PointsMaterial({ size: 0.11, map: sprite, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
const points = new THREE.Points(geometry, material);
points.frustumCulled = false;
scene.add(points);

// ---- scroll + time drive the scene ----
const track = document.getElementById("track");
let scrollP = 0, p = 0;                    // p = damped settle progress (0 = drifting, 1 = in place)
const words = [...document.querySelectorAll("#h1 span")];
const pct = document.getElementById("pct");
const smooth = (x) => x * x * (3 - 2 * x);
const clamp01 = THREE.MathUtils.clamp;

function readScroll() {
  const max = track.offsetHeight - innerHeight;
  scrollP = max > 0 ? THREE.MathUtils.clamp(scrollY / max, 0, 1) : 0;
}
addEventListener("scroll", readScroll, { passive: true });

let intro = 0;      // time-driven intro, so the scene settles on its own when nobody scrolls
const tmp = new THREE.Vector3();

function update(time, dt) {
  intro = Math.min(1, intro + dt / 7);                           // 7 s on its own
  const want = Math.max(smooth(intro) * 0.82, scrollP);         // scroll can finish what time started
  p = THREE.MathUtils.damp(p, want, 2.4, dt);

  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;
    const local = smooth(clamp01((p * 1.5 - delay[i]) / 0.7, 0, 1));
    const sx = start[i3], sy = start[i3 + 1], sz = start[i3 + 2];
    // drifting component fades as the particle settles
    const drift = 1 - local, ph = seed[i3], sp = seed[i3 + 1];
    const dx = Math.sin(time * 0.35 * sp + ph) * 0.9 * drift, dy = Math.cos(time * 0.3 * sp + ph * 1.3) * 0.7 * drift, dz = Math.sin(time * 0.22 * sp + ph * 0.7) * 1.1 * drift;
    current[i3]     = THREE.MathUtils.lerp(sx + dx, target[i3], local);
    current[i3 + 1] = THREE.MathUtils.lerp(sy + dy, target[i3 + 1] + Math.sin(time * 1.2 + ph) * 0.012, local);
    current[i3 + 2] = THREE.MathUtils.lerp(sz + dz, target[i3 + 2], local);
  }
  geometry.attributes.position.needsUpdate = true;

  // camera: slow orbit when drifting, squares up to the grid when settled
  const orbit = (1 - p) * Math.sin(time * 0.12) * 0.55;
  const dist = THREE.MathUtils.lerp(15, fitDist(), smooth(p));
  camera.position.set(Math.sin(orbit) * dist * 0.5, (1 - p) * 1.4, Math.cos(orbit * 0.5) * dist);
  camera.lookAt(0, 0, 0);
  points.material.size = THREE.MathUtils.lerp(0.13, 0.1, p) * (renderer.domElement.height / 900 > 1.4 ? 1.4 : 1);

  // headline words: blur-in staggered with progress, calm and legible
  words.forEach((w, i) => {
    const t = smooth(clamp01((p * 1.25 - 0.05 - i * 0.06) / 0.4, 0, 1));
    w.style.opacity = t; w.style.filter = "blur(" + (1 - t) * 10 + "px)"; w.style.transform = "translateY(" + (1 - t) * 18 + "px)";
  });
  pct.textContent = Math.round(p * 100) + "%";
}

function fitDist() {
  // distance at which the full grid width fits with a margin
  const vFov = THREE.MathUtils.degToRad(camera.fov / 2);
  return Math.max(10.5, (gridW / 2 + 1.1) / (Math.tan(vFov) * camera.aspect));
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  readScroll();
}
addEventListener("resize", resize);
resize();

const timer = new Timer(); timer.connect?.(document);
function frame(ts) {
  timer.update(ts);
  update(timer.getElapsed(), Math.min(timer.getDelta(), 0.05));
  renderer.render(scene, camera);
}

function applyMotionPreference() {
  renderer.setAnimationLoop(null);
  if (reduceMotion.matches) {          // settled grid, no drift
    intro = 1; p = 1;
    update(0, 0.016); update(0, 5); renderer.render(scene, camera);
    addEventListener("resize", () => { update(0, 0.016); renderer.render(scene, camera); });
  } else renderer.setAnimationLoop(frame);
}
reduceMotion.addEventListener("change", applyMotionPreference);
applyMotionPreference();

addEventListener("pagehide", () => {
  renderer.setAnimationLoop(null);
  geometry.dispose(); material.dispose(); sprite.dispose(); renderer.dispose();
});
</script>
</body>
</html>
