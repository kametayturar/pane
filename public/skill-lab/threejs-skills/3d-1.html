<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater – calm scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#f3f8f6;--bg2:#dcecea;--ink:#0f2a2e;--muted:#4f6a6e;--teal:#0e7c86;--teal-d:#0a5b63;--line:#cfe0df}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 72% 55%,#ffffff 0%,var(--bg1) 38%,var(--bg2) 100%);overflow-x:hidden}
  .hero{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;max-width:1280px;margin:0 auto;padding:0 40px}
  nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:26px 40px;max-width:1280px;margin:0 auto;z-index:3}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
  .brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#35b3a8);display:grid;place-items:center}
  .brand svg{width:18px;height:18px}
  nav a.cta{font-weight:600;font-size:14px;color:var(--teal-d);text-decoration:none;border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:99px}
  .copy{position:relative;z-index:2;padding:110px 0 70px}
  .eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--teal-d);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:99px;margin-bottom:22px}
  .eyebrow b{width:7px;height:7px;border-radius:50%;background:#35b3a8;display:block}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(40px,5.4vw,72px);line-height:1.02;letter-spacing:-.025em}
  h1 em{font-style:normal;color:var(--teal)}
  .sub{margin-top:22px;font-size:clamp(16px,1.5vw,19px);line-height:1.55;color:var(--muted);max-width:30em}
  .actions{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{font:600 15px "DM Sans",sans-serif;padding:14px 22px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 10px 24px -10px rgba(14,124,134,.6)}
  .stage{position:relative;height:100vh;min-height:560px}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  .readout{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--teal-d);white-space:nowrap}
  .readout span{color:var(--muted);font-weight:500}
  @media (max-width:860px){
    .hero{grid-template-columns:1fr;padding:0 20px}
    nav{padding:20px}
    .copy{padding:92px 0 0;text-align:left}
    .stage{height:62vh;min-height:380px;margin:0 -20px}
    .readout{bottom:6%}
  }
</style>
</head>
<body>
<nav><div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 9c3-3 5-3 9 0s6 3 9 0M3 15c3-3 5-3 9 0s6 3 9 0"/></svg></i>Tidewater</div><a class="cta" href="#">Book a demo</a></nav>
<main class="hero">
  <section class="copy">
    <div class="eyebrow"><b></b>Scheduling for physiotherapy clinics</div>
    <h1>Every slot finds its <em>calm</em> place.</h1>
    <p class="sub">Tidewater keeps the day flowing: bookings settle into open time, reminders go out on their own, and gaps fill before they cost you a session.</p>
    <div class="actions"><a class="btn primary" href="#">Start free for 14 days</a><a class="btn" href="#">See how it works</a></div>
  </section>
  <section class="stage" aria-label="Animated scene: appointment slots filling in around a ring">
    <canvas id="gl"></canvas>
    <div class="readout" id="readout" aria-live="off">Slots booked <span id="n">0 / 24</span></div>
  </section>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { Timer } from "three/addons/misc/Timer.js";

const canvas = document.getElementById("gl");
const stage = canvas.parentElement;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

// Renderer: capped pixel ratio, filmic tone mapping, soft shadows
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
const world = new THREE.Group();          // everything that tilts with the pointer
scene.add(world);

// Image-based light built from a tiny studio scene (PMREM), so the physical materials have something to reflect
{
  const env = new THREE.Scene();
  env.background = new THREE.Color(0xdfeeee);
  const panel = (w, h, x, y, z, intensity, color = 0xffffff) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  };
  panel(10, 6, 0, 8, 2, 6); panel(6, 6, -8, 3, 4, 3, 0xcfeeee); panel(6, 6, 8, 2, -3, 2.2, 0xfff2dd); panel(14, 2, 0, 1, -9, 1.5);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  scene.environmentIntensity = 0.9;
  pmrem.dispose();
  env.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
}

const key = new THREE.DirectionalLight(0xfff4e6, 2.2);
key.position.set(4, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 22 });
key.shadow.bias = -0.0004; key.shadow.radius = 5;
scene.add(key, new THREE.HemisphereLight(0xe8f6f4, 0xcfe0dc, 0.5));

// Base: a sand plinth with a recessed track, plus a shadow-catching floor
const sand = new THREE.MeshStandardMaterial({ color: 0xe8d9bd, roughness: 0.85, metalness: 0 });
const plinth = new THREE.Mesh(new THREE.CylinderGeometry(3.9, 4.05, 0.32, 96), sand);
plinth.position.y = -0.16; plinth.receiveShadow = true; plinth.castShadow = true; world.add(plinth);
const track = new THREE.Mesh(new THREE.RingGeometry(2.25, 3.0, 96), new THREE.MeshStandardMaterial({ color: 0xd9c7a6, roughness: 0.9 }));
track.rotation.x = -Math.PI / 2; track.position.y = 0.002; track.receiveShadow = true; world.add(track);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.33; floor.receiveShadow = true; scene.add(floor);

// 24 slot blocks as one InstancedMesh (one draw call): rounded-rect extrusion, tangent to the ring
const COUNT = 24, RADIUS = 2.62;
const shape = new THREE.Shape();
{ const w = 0.5, d = 0.62, r = 0.14, x = -w / 2, y = -d / 2;
  shape.moveTo(x + r, y); shape.lineTo(x + w - r, y); shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + d - r); shape.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  shape.lineTo(x + r, y + d); shape.quadraticCurveTo(x, y + d, x, y + d - r);
  shape.lineTo(x, y + r); shape.quadraticCurveTo(x, y, x + r, y); }
const blockGeo = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 3, curveSegments: 6 });
blockGeo.rotateX(-Math.PI / 2);          // extrude upward (+Y), footprint on XZ
blockGeo.translate(0, 0, 0);
const blockMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.38, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.35 });
const blocks = new THREE.InstancedMesh(blockGeo, blockMat, COUNT);
blocks.castShadow = true; blocks.receiveShadow = true;
blocks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
world.add(blocks);

// Pearl: the "next booking", hops from slot to slot
const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.34, 48, 32),
  new THREE.MeshPhysicalMaterial({ color: 0xfbf7ef, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, iridescence: 0.6, iridescenceIOR: 1.4, sheen: 0.4, sheenColor: new THREE.Color(0xb7e6e2) }));
pearl.castShadow = true; world.add(pearl);

const COLOR_FREE = new THREE.Color(0xe8f1ef), COLOR_BOOKED = new THREE.Color(0x0e7c86), COLOR_NEXT = new THREE.Color(0x9fdcd6);
const booked = new Float32Array(COUNT);        // damped 0..1 "booked" amount per slot
const bookedTarget = new Float32Array(COUNT); // what each slot is easing toward
const dummy = new THREE.Object3D(), tmpColor = new THREE.Color();
const slotAngle = (i) => (i / COUNT) * Math.PI * 2;

let cursor = 0, lastHop = 0, hopFrom = new THREE.Vector3(), hopTo = new THREE.Vector3(), hopT = 1;
const HOP_EVERY = 1.1;
const slotTop = (i, out) => out.set(Math.cos(slotAngle(i)) * RADIUS, 1.05, Math.sin(slotAngle(i)) * RADIUS);
slotTop(0, hopTo); hopFrom.copy(hopTo); pearl.position.copy(hopTo);

function step(time, dt) {
  const tide = time * 0.9;
  // schedule: pearl lands, slot books, pearl moves on; after a full lap the day resets calmly
  if (time - lastHop > HOP_EVERY) {
    lastHop = time;
    bookedTarget[cursor] = 1;
    cursor = (cursor + 1) % COUNT;
    if (cursor === 0) bookedTarget.fill(0);
    hopFrom.copy(pearl.position); slotTop(cursor, hopTo); hopT = 0;
  }
  let n = 0;
  for (let i = 0; i < COUNT; i++) {
    booked[i] = THREE.MathUtils.damp(booked[i], bookedTarget[i], 3.2, dt);   // frame-rate independent
    if (bookedTarget[i] > 0.5) n++;
    const wave = 0.5 + 0.13 * Math.sin(tide + i * 0.5) + 0.06 * Math.sin(tide * 1.7 - i * 0.9);
    const h = wave + booked[i] * 0.5;
    const a = slotAngle(i);
    dummy.position.set(Math.cos(a) * RADIUS, 0.01, Math.sin(a) * RADIUS);
    dummy.rotation.set(0, -a, 0);
    dummy.scale.set(1, h, 1);
    dummy.updateMatrix();
    blocks.setMatrixAt(i, dummy.matrix);
    tmpColor.copy(COLOR_FREE).lerp(COLOR_BOOKED, booked[i]);
    if (i === cursor) tmpColor.lerp(COLOR_NEXT, 0.7);
    blocks.setColorAt(i, tmpColor);
  }
  blocks.instanceMatrix.needsUpdate = true; blocks.instanceColor.needsUpdate = true;

  // pearl arc between slots
  hopT = Math.min(1, hopT + dt / (HOP_EVERY * 0.8));
  const e = hopT * hopT * (3 - 2 * hopT);
  pearl.position.lerpVectors(hopFrom, hopTo, e);
  pearl.position.y += Math.sin(Math.PI * e) * 0.9 + Math.sin(time * 1.6) * 0.04;
  document.getElementById("n").textContent = n + " / " + COUNT;
}

// Pointer parallax, damped
const pointer = { x: 0, y: 0, sx: 0, sy: 0 };
addEventListener("pointermove", (e) => { pointer.x = (e.clientX / innerWidth) * 2 - 1; pointer.y = (e.clientY / innerHeight) * 2 - 1; });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // fit the plinth (radius ~4.1) horizontally, whatever the aspect
  const d = Math.max(13, 4.35 / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect));
  camera.position.set(0, d * 0.52, d * 0.85);
  camera.lookAt(0, 0.4, 0);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const timer = new Timer();
timer.connect?.(document);                  // pauses the delta while the tab is hidden

function frame(ts) {
  timer.update(ts);
  const dt = Math.min(timer.getDelta(), 0.05), time = timer.getElapsed();
  step(time, dt);
  pointer.sx = THREE.MathUtils.damp(pointer.sx, pointer.x, 3, dt);
  pointer.sy = THREE.MathUtils.damp(pointer.sy, pointer.y, 3, dt);
  world.rotation.y = time * 0.07 + pointer.sx * 0.25;
  world.rotation.x = pointer.sy * 0.06;
  renderer.render(scene, camera);
}

function applyMotionPreference() {
  renderer.setAnimationLoop(null);
  if (reduceMotion.matches) {
    // a settled, half-booked day as a still frame
    for (let k = 0; k < 11; k++) booked[k] = bookedTarget[k] = 1;
    cursor = 11; slotTop(11, hopTo); pearl.position.copy(hopTo).setY(1.5);
    hopT = 1; step(0, 0.016); world.rotation.y = 0.5; renderer.render(scene, camera);
  } else {
    renderer.setAnimationLoop(frame);
  }
}
reduceMotion.addEventListener("change", applyMotionPreference);
applyMotionPreference();
addEventListener("resize", () => { if (reduceMotion.matches) renderer.render(scene, camera); });

addEventListener("pagehide", () => {      // release GPU memory
  renderer.setAnimationLoop(null);
  [blockGeo, plinth.geometry, track.geometry, floor.geometry, pearl.geometry].forEach((g) => g.dispose());
  [blockMat, sand, pearl.material, track.material, floor.material].forEach((m) => m.dispose());
  scene.environment?.dispose(); blocks.dispose(); renderer.dispose();
});
</script>
</body>
</html>
