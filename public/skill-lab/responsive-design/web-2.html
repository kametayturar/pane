<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ea;--paper:#fffdf8;--ink:#12302e;--muted:#5a6e6b;--line:#e2dccd;--teal:#0f766e;--teal-d:#0a5852;--teal-l:#d7ece8;--sand:#ece5d3;
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
  --text-sm:clamp(.875rem,.8rem + .375vw,1rem);
  --text-base:clamp(1rem,.9rem + .5vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + .625vw,1.25rem);
  --text-3xl:clamp(1.875rem,1.5rem + 1.875vw,2.5rem);
  --text-4xl:clamp(2.25rem,1.4rem + 3.4vw,3.75rem);
  --space-sm:clamp(.5rem,.4rem + .5vw,.75rem);
  --space-md:clamp(1rem,.8rem + 1vw,1.5rem);
  --space-lg:clamp(1.5rem,1.2rem + 1.5vw,2.5rem);
  --space-xl:clamp(2rem,1.5rem + 2.5vw,4rem);
  --gutter:clamp(1.125rem,.5rem + 2.5vw,2rem);
}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
body{font-family:var(--sans);font-size:var(--text-base);line-height:1.6;background:var(--bg);color:var(--ink);overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f0b34a;outline-offset:3px}
.wrap{inline-size:min(100% - 2*var(--gutter),70rem);margin-inline:auto}
h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;line-height:1.08}
.site-head{display:flex;align-items:center;justify-content:space-between;padding-block:var(--space-md)}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--serif);font-weight:600;font-size:1.4rem}
.brand i{inline-size:1.7rem;block-size:1.7rem;border-radius:.5rem;background:var(--teal);position:relative;overflow:hidden}
.brand i::after{content:"";position:absolute;inset-inline:-.25rem;inset-block-end:.3rem;block-size:.55rem;border-radius:50%;background:var(--teal-l)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-block-size:48px;padding-inline:1.5rem;border-radius:999px;font-weight:600;font-size:var(--text-sm);border:1px solid transparent;cursor:pointer;transition:background .2s,border-color .2s}
.btn-pri{background:var(--teal);color:#fff}.btn-pri:hover{background:var(--teal-d)}
.btn-sec{border-color:var(--line);background:transparent}.btn-sec:hover{border-color:var(--ink)}
.btn-block{inline-size:100%}
.head-link{display:none;color:var(--muted);font-size:var(--text-sm);margin-inline-end:var(--space-md)}
.intro{text-align:center;padding-block:var(--space-lg) var(--space-md)}
.eyebrow{font-size:.8125rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--teal)}
.intro h1{font-size:var(--text-4xl);margin-block:var(--space-sm);max-inline-size:16ch;margin-inline:auto}
.intro p{color:var(--muted);font-size:var(--text-lg);max-inline-size:36ch;margin-inline:auto}
/* billing toggle: >=44px targets */
.seg{display:inline-flex;margin-block:var(--space-lg) 0;background:var(--sand);border-radius:999px;padding:4px}
.seg button{min-block-size:44px;border:0;background:transparent;border-radius:999px;padding-inline:1.25rem;font-weight:600;font-size:var(--text-sm);color:var(--muted);cursor:pointer;display:inline-flex;gap:.5rem;align-items:center}
.seg button[aria-checked=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(18,48,46,.18)}
.seg .save{font-size:.72rem;background:var(--teal);color:#fff;border-radius:99px;padding:.1rem .5rem}
/* plans: intrinsic grid. Wraps itself from 1 to 3 columns, no breakpoints */
.plans{list-style:none;padding:0;display:grid;gap:var(--space-md);padding-block:var(--space-lg) var(--space-xl);grid-template-columns:repeat(auto-fit,minmax(min(17rem,100%),1fr));align-items:stretch}
.plans>li{container:plan / inline-size;display:block}
.plan{position:relative;block-size:100%;display:grid;gap:var(--space-md);align-content:start;background:var(--paper);border:1px solid var(--line);border-radius:1.25rem;padding:var(--space-md)}
.plan.pop{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),0 30px 50px -30px rgba(15,118,110,.45)}
.badge{position:absolute;inset-block-start:-.8rem;inset-inline-start:var(--space-md);background:var(--teal);color:#fff;font-size:.75rem;font-weight:600;letter-spacing:.04em;padding:.25rem .75rem;border-radius:99px}
.plan h2{font-size:clamp(1.5rem,5cqi + .5rem,1.9rem)}
.plan-top{display:grid;gap:var(--space-md)}
.blurb{color:var(--muted);font-size:var(--text-sm);margin-block-start:.25rem}
@media (min-width:48em){.blurb{min-block-size:3.2em}}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .5rem;font-variant-numeric:tabular-nums}
.price b{font-family:var(--serif);font-weight:500;font-size:clamp(2.25rem,12cqi + .5rem,3.25rem);line-height:1;letter-spacing:-.03em}
.price span{color:var(--muted);font-size:var(--text-sm);white-space:nowrap}
.price s{color:var(--muted);font-size:var(--text-sm)}
.billed{color:var(--muted);font-size:.8125rem;min-block-size:1.3em;margin-block-start:.25rem}
.feats{list-style:none;padding:0;padding-block-start:var(--space-md);border-block-start:1px solid var(--line);display:grid;gap:.7rem;font-size:var(--text-sm)}
.feats li{display:grid;grid-template-columns:1.25rem 1fr;gap:.6rem;align-items:start}
.feats svg{inline-size:1.1rem;block-size:1.1rem;margin-block-start:.2rem;stroke:var(--teal);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:.8125rem;color:var(--muted);background:var(--sand);border-radius:.7rem;padding:.5rem .75rem}
/* when a card is given a wide column (single-column phones/tablets), use the room */
@container plan (min-width:28rem){
  .feats{grid-template-columns:1fr 1fr;column-gap:var(--space-md)}
  .plan-top{grid-template-columns:1fr auto;align-items:end}
  .blurb{min-block-size:0!important}
}
.fine{text-align:center;color:var(--muted);font-size:.875rem;padding-block-end:var(--space-lg)}
.site-foot{border-block-start:1px solid var(--line);padding-block:var(--space-md);color:var(--muted);font-size:.875rem}
@media (min-width:48em){.head-link{display:inline}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <a class="brand" href="#"><i></i>Tidewater</a>
    <div><a class="head-link" href="#">Features</a><a class="btn btn-pri" href="#start">Start free</a></div>
  </header>
  <main>
    <section class="intro">
      <span class="eyebrow">Pricing</span>
      <h1>Simple plans for every size of clinic</h1>
      <p>Every plan starts with a 30-day free trial. Change or cancel whenever the clinic changes.</p>
      <div class="seg" role="radiogroup" aria-label="Billing period">
        <button type="button" role="radio" aria-checked="true" data-b="monthly">Monthly</button>
        <button type="button" role="radio" aria-checked="false" data-b="yearly">Yearly <span class="save">Save 20%</span></button>
      </div>
    </section>
    <ul class="plans" id="plans"></ul>
    <p class="fine">Prices in USD. Yearly billing takes 20% off every plan.</p>
  </main>
  <footer class="site-foot">© 2026 Tidewater · Scheduling for small physiotherapy clinics</footer>
</div>
<script>
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const plans=[
  {name:'Solo',monthly:19,blurb:'One therapist running their own practice.',cta:'Start with Solo',feats:['1 therapist calendar','Up to 150 appointments / month','SMS and email reminders','Online booking page','Email support']},
  {name:'Clinic',monthly:49,pop:true,blurb:'A growing team that shares rooms and equipment.',cta:'Start with Clinic',feats:['Up to 8 therapists','Unlimited appointments','Room and equipment booking','Automatic waitlist','Insurance export (CSV)','Priority chat support']},
  {name:'Group',monthly:129,blurb:'Multi-site clinics with shared reporting.',cta:'Talk to us',note:'Includes 3 onboarding calls with a Tidewater specialist.',feats:['Unlimited therapists and sites','Cross-site scheduling','Roles and permissions','SSO and audit log','Custom reminders and branding','Dedicated onboarding']}
];
const money=n=>'$'+(Number.isInteger(n)?n:n.toFixed(2));
let billing='monthly';
function render(){
  const y=billing==='yearly';
  document.getElementById('plans').innerHTML=plans.map(p=>{
    const now=y?p.monthly*.8:p.monthly;
    return `<li><article class="plan${p.pop?' pop':''}">
      ${p.pop?'<span class="badge">Most popular</span>':''}
      <div class="plan-top">
        <div><h2>${p.name}</h2><p class="blurb">${p.blurb}</p></div>
        <div><div class="price"><b>${money(now)}</b><span>/ month</span>${y?`<s>${money(p.monthly)}</s>`:''}</div>
        <p class="billed">${y?`Billed ${money(p.monthly*12*.8)} per year`:'Billed monthly, cancel anytime'}</p></div>
      </div>
      <a class="btn ${p.pop?'btn-pri':'btn-sec'} btn-block" href="#start">${p.cta}</a>
      <ul class="feats">${p.feats.map(f=>`<li>${CHECK}<span>${f}</span></li>`).join('')}</ul>
      ${p.note?`<p class="note">${p.note}</p>`:''}
    </article></li>`}).join('');
}
document.querySelector('.seg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;billing=b.dataset.b;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-checked',x===b));render();
});
render();
</script>
</body>
</html>
