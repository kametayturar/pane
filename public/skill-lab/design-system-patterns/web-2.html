<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tidewater pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ Layer 1: primitive tokens (raw values) ============ */
:root {
  --color-teal-50: #effcfa; --color-teal-100: #d3f6f0; --color-teal-200: #a9ebe1; --color-teal-300: #72dacd;
  --color-teal-400: #3cc1b3; --color-teal-500: #1fa597; --color-teal-600: #14857b; --color-teal-700: #136a64;
  --color-teal-800: #14544f; --color-teal-900: #12443f; --color-teal-950: #052a28;
  --color-gray-0: #ffffff; --color-gray-50: #fafafa; --color-gray-100: #f5f5f5; --color-gray-200: #e5e5e5;
  --color-gray-300: #d4d4d4; --color-gray-400: #a3a3a3; --color-gray-500: #737373; --color-gray-600: #525252;
  --color-gray-700: #404040; --color-gray-800: #262626; --color-gray-900: #171717; --color-gray-950: #0a0a0a;
  --color-red-500: #ef4444; --color-red-600: #dc2626; --color-red-300: #fca5a5;
  --color-amber-500: #f59e0b;

  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem;
  --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem; --space-24: 6rem;

  --font-sans: "Inter", system-ui, sans-serif; --font-mono: "JetBrains Mono", Menlo, monospace;
  --font-size-xs: 0.75rem; --font-size-sm: 0.875rem; --font-size-base: 1rem; --font-size-lg: 1.125rem;
  --font-size-xl: 1.25rem; --font-size-2xl: 1.5rem; --font-size-4xl: 2.25rem; --font-size-6xl: 3.75rem;
  --font-weight-medium: 500; --font-weight-semibold: 600; --font-weight-bold: 700;
  --line-height-tight: 1.1; --line-height-normal: 1.5; --line-height-relaxed: 1.7;
  --letter-spacing-tight: -0.025em;

  --radius-sm: 0.25rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --duration-fast: 120ms; --duration-base: 200ms; --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
}

/* ============ Layer 2: semantic tokens (meaning) – light ============ */
:root, :root.light {
  color-scheme: light;
  --text-primary: var(--color-gray-900);
  --text-secondary: var(--color-gray-600);
  --text-tertiary: var(--color-gray-500);
  --text-on-interactive: var(--color-gray-0);
  --text-link: var(--color-teal-700);
  --surface-default: var(--color-gray-0);
  --surface-elevated: var(--color-gray-50);
  --surface-sunken: var(--color-teal-50);
  --surface-accent-subtle: var(--color-teal-100);
  --border-default: var(--color-gray-200);
  --border-strong: var(--color-gray-300);
  --interactive-primary: var(--color-teal-700);
  --interactive-primary-hover: var(--color-teal-800);
  --focus-ring: var(--color-teal-500);
  --feedback-danger: var(--color-red-600);
  --shadow-elevated: var(--shadow-md);
}
/* ============ Semantic tokens – dark (class OR system preference) ============ */
:root.dark {
  color-scheme: dark;
  --text-primary: var(--color-gray-50);
  --text-secondary: var(--color-gray-400);
  --text-tertiary: var(--color-gray-500);
  --text-on-interactive: var(--color-teal-950);
  --text-link: var(--color-teal-300);
  --surface-default: var(--color-gray-950);
  --surface-elevated: var(--color-gray-900);
  --surface-sunken: #0b1f1e;
  --surface-accent-subtle: var(--color-teal-900);
  --border-default: var(--color-gray-800);
  --border-strong: var(--color-gray-700);
  --interactive-primary: var(--color-teal-400);
  --interactive-primary-hover: var(--color-teal-300);
  --focus-ring: var(--color-teal-400);
  --feedback-danger: var(--color-red-300);
  --shadow-elevated: 0 10px 15px -3px rgb(0 0 0 / 0.6);
}
@media (prefers-color-scheme: dark) {
  :root:not(.light):not(.dark) {
    color-scheme: dark;
    --text-primary: var(--color-gray-50); --text-secondary: var(--color-gray-400); --text-tertiary: var(--color-gray-500);
    --text-on-interactive: var(--color-teal-950); --text-link: var(--color-teal-300);
    --surface-default: var(--color-gray-950); --surface-elevated: var(--color-gray-900); --surface-sunken: #0b1f1e;
    --surface-accent-subtle: var(--color-teal-900);
    --border-default: var(--color-gray-800); --border-strong: var(--color-gray-700);
    --interactive-primary: var(--color-teal-400); --interactive-primary-hover: var(--color-teal-300);
    --focus-ring: var(--color-teal-400); --feedback-danger: var(--color-red-300);
    --shadow-elevated: 0 10px 15px -3px rgb(0 0 0 / 0.6);
  }
}
@media (prefers-contrast: more) { :root { --border-default: var(--border-strong); --text-secondary: var(--text-primary); } }
@media (prefers-reduced-motion: reduce) { :root { --duration-fast: 0ms; --duration-base: 0ms; } *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }

/* ============ Layer 3: component tokens (specific usage) ============ */
:root {
  --button-bg: var(--interactive-primary);
  --button-bg-hover: var(--interactive-primary-hover);
  --button-text: var(--text-on-interactive);
  --button-radius: var(--radius-md);
  --button-padding-x: var(--space-5);
  --button-padding-y: var(--space-3);
  --button-secondary-border: var(--border-strong);
  --card-bg: var(--surface-elevated);
  --card-border: var(--border-default);
  --card-radius: var(--radius-xl);
  --card-padding: var(--space-6);
  --badge-bg: var(--surface-accent-subtle);
  --badge-text: var(--text-link);
  --input-bg: var(--surface-default);
  --input-border: var(--border-strong);
  --input-radius: var(--radius-md);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);font-size:var(--font-size-base);line-height:var(--line-height-normal);color:var(--text-primary);background:var(--surface-default);transition:background var(--duration-base) var(--ease-out),color var(--duration-base) var(--ease-out);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.container{max-width:1120px;margin-inline:auto;padding-inline:var(--space-6)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);font:inherit;font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold);padding:var(--button-padding-y) var(--button-padding-x);border-radius:var(--button-radius);border:1px solid transparent;background:var(--button-bg);color:var(--button-text);cursor:pointer;text-decoration:none;transition:background var(--duration-fast) var(--ease-out),border-color var(--duration-fast),transform var(--duration-fast)}
.btn:hover{background:var(--button-bg-hover)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn--secondary{background:transparent;color:var(--text-primary);border-color:var(--button-secondary-border)}
.btn--secondary:hover{background:var(--surface-elevated)}
.btn--lg{--button-padding-x:var(--space-6);--button-padding-y:var(--space-4);font-size:var(--font-size-base)}
.btn--block{width:100%}
.site-header{border-bottom:1px solid var(--border-default);background:var(--surface-default)}
.site-header .container{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);height:64px}
.brand{display:flex;align-items:center;gap:var(--space-2);font-weight:var(--font-weight-bold);letter-spacing:var(--letter-spacing-tight);color:var(--text-primary);text-decoration:none}
.brand svg{width:26px;height:26px;color:var(--interactive-primary)}
.nav{display:flex;align-items:center;gap:var(--space-6);font-size:var(--font-size-sm)}
.nav a{color:var(--text-secondary);text-decoration:none}.nav a:hover{color:var(--text-primary)}
.theme-switch{display:inline-flex;padding:2px;border:1px solid var(--border-default);border-radius:var(--radius-full);background:var(--surface-elevated)}
.theme-switch button{font:inherit;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);padding:4px 10px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--text-secondary);cursor:pointer}
.theme-switch button[aria-pressed="true"]{background:var(--surface-default);color:var(--text-primary);box-shadow:var(--shadow-sm)}
@media(max-width:720px){.nav a{display:none}.container{padding-inline:var(--space-4)}}

/* component tokens: pricing */
:root{
  --plan-bg: var(--surface-default);
  --plan-border: var(--border-default);
  --plan-featured-border: var(--interactive-primary);
  --plan-featured-bg: var(--surface-sunken);
  --plan-radius: var(--radius-xl);
  --plan-padding: var(--space-8);
  --toggle-bg: var(--surface-elevated);
  --toggle-border: var(--border-default);
  --toggle-thumb-bg: var(--interactive-primary);
  --toggle-thumb-text: var(--text-on-interactive);
  --check-color: var(--interactive-primary);
}
.pricing{padding-block:var(--space-16) var(--space-24)}
.head{text-align:center;max-width:40rem;margin-inline:auto}
.head h1{font-size:clamp(2rem,4.4vw,var(--font-size-4xl) * 1.25);letter-spacing:var(--letter-spacing-tight);line-height:var(--line-height-tight)}
.head p{margin-top:var(--space-4);color:var(--text-secondary);font-size:var(--font-size-lg);line-height:var(--line-height-relaxed)}
.billing{display:flex;align-items:center;justify-content:center;gap:var(--space-3);margin-top:var(--space-8)}
.seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid var(--toggle-border);background:var(--toggle-bg);border-radius:var(--radius-full)}
.seg::before{content:"";position:absolute;inset:4px auto 4px 4px;width:calc(50% - 4px);border-radius:var(--radius-full);background:var(--toggle-thumb-bg);transition:transform var(--duration-base) var(--ease-out)}
.seg[data-period="yearly"]::before{transform:translateX(100%)}
.seg button{position:relative;font:inherit;font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold);padding:8px 22px;border:0;background:transparent;color:var(--text-secondary);border-radius:var(--radius-full);cursor:pointer;transition:color var(--duration-base)}
.seg button[aria-checked="true"]{color:var(--toggle-thumb-text)}
.save{font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);padding:3px 10px;border-radius:var(--radius-full);background:var(--badge-bg);color:var(--badge-text)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6);margin-top:var(--space-12);align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;background:var(--plan-bg);border:1px solid var(--plan-border);border-radius:var(--plan-radius);padding:var(--plan-padding)}
.plan--featured{border:2px solid var(--plan-featured-border);background:var(--plan-featured-bg);box-shadow:var(--shadow-elevated);padding:calc(var(--plan-padding) - 1px)}
.plan .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);padding:4px 14px;border-radius:var(--radius-full);background:var(--interactive-primary);color:var(--text-on-interactive);white-space:nowrap}
.plan h2{font-size:var(--font-size-xl);letter-spacing:var(--letter-spacing-tight)}
.plan .who{margin-top:var(--space-1);font-size:var(--font-size-sm);color:var(--text-secondary);min-height:3em}
.price{display:flex;align-items:baseline;gap:var(--space-2);margin-top:var(--space-6)}
.price .amt{font-size:3rem;font-weight:var(--font-weight-bold);letter-spacing:var(--letter-spacing-tight);line-height:1;font-variant-numeric:tabular-nums}
.price .per{color:var(--text-secondary);font-size:var(--font-size-sm)}
.billed{height:1.4em;margin-top:var(--space-2);font-size:var(--font-size-xs);color:var(--text-tertiary)}
.plan .btn{margin-top:var(--space-6)}
.plan hr{border:0;border-top:1px solid var(--border-default);margin:var(--space-6) 0}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-3);font-size:var(--font-size-sm)}
.plan li{display:grid;grid-template-columns:20px 1fr;gap:var(--space-2);align-items:start;color:var(--text-primary)}
.plan li svg{width:18px;height:18px;margin-top:1px;color:var(--check-color)}
.plan li.off{color:var(--text-tertiary)}.plan li.off svg{color:var(--text-tertiary)}
.plan .lead{font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-3)}
.note{text-align:center;margin-top:var(--space-10);font-size:var(--font-size-sm);color:var(--text-secondary)}
.num-swap{display:inline-block;animation:swap var(--duration-base) var(--ease-out)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:900px){.plans{grid-template-columns:1fr;max-width:28rem;margin-inline:auto}.plan .who{min-height:0}.pricing{padding-block:var(--space-10)}}
</style>
</head>
<body>
<header class="site-header"><div class="container">
  <a class="brand" href="#"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3" y="5" width="26" height="24" rx="6" stroke="currentColor" stroke-width="2.4"/><path d="M3 12h26" stroke="currentColor" stroke-width="2.4"/><path d="M8 21c2.5-3 4.5-3 7 0s4.5 3 9 0" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Tidewater</a>
  <nav class="nav" aria-label="Primary"><a href="#">Features</a><a href="#">Pricing</a><a href="#">Customers</a>
    <div class="theme-switch" role="group" aria-label="Theme"><button data-theme-btn="light" aria-pressed="false">Light</button><button data-theme-btn="dark" aria-pressed="false">Dark</button><button data-theme-btn="system" aria-pressed="true">Auto</button></div>
  </nav>
</div></header>

<main class="pricing"><div class="container">
  <div class="head">
    <h1>Pricing that grows with your clinic</h1>
    <p>Every plan includes online booking and reminders. Upgrade when you add therapists, not before.</p>
  </div>
  <div class="billing">
    <div class="seg" id="seg" role="radiogroup" aria-label="Billing period" data-period="monthly">
      <button role="radio" aria-checked="true" data-period="monthly">Monthly</button>
      <button role="radio" aria-checked="false" data-period="yearly">Yearly</button>
    </div>
    <span class="save">Save 20%</span>
  </div>

  <div class="plans" id="plans"></div>
  <p class="note">Prices in USD per month. Cancel any time. Yearly plans are billed once a year.</p>
</div></main>

<script>
// Theme: light | dark | system – persisted, follows prefers-color-scheme
(function () {
  var root = document.documentElement, mq = window.matchMedia("(prefers-color-scheme: dark)");
  function read() { try { return localStorage.getItem("tw-theme") || "system"; } catch (e) { return "system"; } }
  function apply(t) {
    var dark = t === "dark" || (t === "system" && mq.matches);
    root.classList.remove("light", "dark"); root.classList.add(dark ? "dark" : "light");
    document.querySelectorAll("[data-theme-btn]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.themeBtn === t)); });
  }
  var theme = read(); apply(theme);
  mq.addEventListener("change", function () { if (theme === "system") apply("system"); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-theme-btn]"); if (!b) return;
    theme = b.dataset.themeBtn; try { localStorage.setItem("tw-theme", theme); } catch (e) {} apply(theme);
  });
})();

</script>
<script>
var CHECK='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8.5" opacity=".25"/><path d="M6 10.2l2.8 2.8L14 7.6"/></svg>';
var DASH='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 10h8"/></svg>';
var PLANS=[
 {name:'Solo',price:19,who:'One therapist running their own diary.',cta:'Start with Solo',btn:'btn--secondary',features:[['1 therapist, 1 room',1],['Online booking page',1],['SMS and email reminders',1],['Patient notes and CSV import',1],['Waiting-list auto-fill',0],['Team calendars',0]]},
 {name:'Clinic',price:49,who:'A small team sharing rooms and equipment.',cta:'Start with Clinic',featured:1,features:[['Up to 6 therapists, 4 rooms',1],['Everything in Solo',1],['Waiting-list auto-fill',1],['Team calendars and room clash blocking',1],['No-show reports',1],['Priority email support',1]]},
 {name:'Group',price:129,who:'Multi-site practices that need one overview.',cta:'Talk to us',btn:'btn--secondary',features:[['Unlimited therapists and sites',1],['Everything in Clinic',1],['Cross-site calendars',1],['Roles, permissions and audit log',1],['Insurer and invoice exports',1],['Named onboarding specialist',1]]}
];
var period='monthly', root=document.getElementById('plans');
function fmt(n){return '$'+(Number.isInteger(n)?n:n.toFixed(2));}
function render(animate){
  root.innerHTML=PLANS.map(function(p){
    var m=period==='yearly'?Math.round(p.price*0.8*100)/100:p.price;
    var billed=period==='yearly'?'Billed '+fmt(Math.round(p.price*0.8*12*100)/100)+' per year':'Billed monthly';
    return '<article class="plan'+(p.featured?' plan--featured':'')+'">'+(p.featured?'<span class="tag">Most popular</span>':'')+
    '<h2>'+p.name+'</h2><p class="who">'+p.who+'</p>'+
    '<div class="price"><span class="amt"><span class="'+(animate?'num-swap':'')+'">'+fmt(m)+'</span></span><span class="per">/ month</span></div>'+
    '<p class="billed">'+billed+'</p>'+
    '<a class="btn '+(p.btn||'')+' btn--block" href="#">'+p.cta+'</a><hr>'+
    '<ul>'+p.features.map(function(f){return '<li class="'+(f[1]?'':'off')+'">'+(f[1]?CHECK:DASH)+'<span>'+f[0]+'</span></li>';}).join('')+'</ul></article>';
  }).join('');
}
document.getElementById('seg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; period=b.dataset.period;
  this.dataset.period=period;
  this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-checked',String(x===b));});
  render(true);
});
render(false);
</script>
</body>
</html>
