<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater – appointment menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef4f4;--card:#fff;--ink:#0f2a2e;--muted:#5b7276;--line:#d9e5e6;--teal:#0e7c86;--teal-d:#0a5b63;--teal-l:#d7eeee;--red:#b3392f}
  *{box-sizing:border-box;margin:0}
  body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden}
  .stage{width:min(680px,100%);position:relative}
  .replay{position:absolute;top:-44px;right:0;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px "DM Sans",sans-serif;padding:8px 14px;border-radius:10px;cursor:pointer}
  .replay:focus-visible{outline:3px solid #7fd0d4;outline-offset:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 28px 24px;box-shadow:0 20px 40px -24px rgba(15,42,46,.25);position:relative}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .tag{display:inline-block;font-size:12px;font-weight:600;background:var(--teal-l);color:var(--teal-d);padding:4px 9px;border-radius:99px;margin-bottom:10px}
  h1{font-size:22px;letter-spacing:-.01em}
  .meta{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.5}
  .kebab{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative}
  .kebab svg{width:20px;height:20px;fill:var(--ink)}
  .kebab:focus-visible{outline:3px solid #7fd0d4;outline-offset:2px}
  .menu-pos{position:relative}
  .menu{position:absolute;top:48px;right:0;width:232px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 22px 44px -14px rgba(15,42,46,.35),0 2px 6px rgba(15,42,46,.08);transform-origin:100% 0;visibility:hidden;z-index:5}
  .hl{position:absolute;left:6px;right:6px;top:6px;height:40px;border-radius:9px;background:var(--teal-l);pointer-events:none}
  .hl.danger{background:#f7dedb}
  .item{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer;background:none;border:0;width:100%;text-align:left;font-family:inherit}
  .item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
  .item.danger{color:var(--red)} .item.danger svg{color:var(--red)}
  .sep{height:1px;background:var(--line);margin:5px 6px}
  .item:focus-visible{outline:2px solid var(--teal)}
  .cursor{position:absolute;left:0;top:0;width:22px;height:22px;z-index:9;pointer-events:none;visibility:hidden;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .ripple{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid var(--teal);pointer-events:none;visibility:hidden}
  .below{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .box{background:#f6fafa;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
  .box b{display:block;color:var(--ink);font-size:14px;margin-top:2px}
  @media (max-width:480px){.menu{width:210px}.below{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <button class="replay" id="replay" type="button">Replay</button>
  <div class="card">
    <div class="row">
      <div>
        <span class="tag">Confirmed</span>
        <h1>Priya Raman · Intake</h1>
        <p class="meta">Tue 10:30 – 11:15 · Dr. Okafor<br>Harbour Physio, Room 2</p>
      </div>
      <div class="menu-pos">
        <button class="kebab" id="kebab" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Appointment actions">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <div class="menu" id="menu" role="menu">
          <div class="hl" id="hl"></div>
          <button class="item" role="menuitem"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Reschedule</button>
          <button class="item" role="menuitem"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>Duplicate</button>
          <button class="item" role="menuitem"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>Send reminder</button>
          <div class="sep"></div>
          <button class="item danger" role="menuitem"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg>Cancel appointment</button>
        </div>
      </div>
    </div>
    <div class="below"><div class="box">Reminder<b>SMS, 24 h before</b></div><div class="box">Insurance<b>Cover pending</b></div></div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L9.4 19z" fill="#0f2a2e" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <div class="ripple" id="ripple"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const items = [...document.querySelectorAll(".item")];
  let tl;
  const mm = gsap.matchMedia();

  // centre of an element relative to the card (cursor lives inside .card)
  const card = $(".card");
  const centre = (el, dx = 0, dy = 0) => {
    const c = card.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - c.left + r.width / 2 + dx, y: r.top - c.top + r.height / 2 + dy };
  };
  const rowY = (i) => 6 + (i < 3 ? i * 40 : 3 * 40 + 11); // highlight y inside the menu (items + separator)

  mm.add({ reduce: "(prefers-reduced-motion: reduce)", normal: "(prefers-reduced-motion: no-preference)" }, (ctx) => {
    if (ctx.conditions.reduce) {          // static: menu simply shown open
      gsap.set("#menu", { autoAlpha: 1 });
      gsap.set("#hl", { autoAlpha: 0 });
      $("#kebab").setAttribute("aria-expanded", "true");
      tl = gsap.timeline({ paused: true });
      return;
    }

    const build = () => {
      if (tl) tl.kill();
      gsap.set("#menu", { autoAlpha: 0, scale: 0.92, y: -8 });
      gsap.set(items, { autoAlpha: 0, y: -6 });
      gsap.set("#hl", { autoAlpha: 0, y: rowY(0) });
      gsap.set("#cursor", { autoAlpha: 0, ...centre($("#kebab"), 90, 120) });
      gsap.set("#ripple", { autoAlpha: 0 });
      $("#kebab").setAttribute("aria-expanded", "false");

      const k = centre($("#kebab"), 6, 6);
      tl = gsap.timeline({ repeat: -1, repeatDelay: 0.8, defaults: { ease: "power3.out", duration: 0.45 } });

      tl.addLabel("approach")
        .to("#cursor", { autoAlpha: 1, x: k.x, y: k.y, duration: 0.8, ease: "power2.inOut" }, "approach")
        .addLabel("press", ">0.1")
        .to("#kebab", { scale: 0.92, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" }, "press")
        .fromTo("#ripple", { x: k.x - 26, y: k.y - 26, scale: 0.5, autoAlpha: 0.9 }, { scale: 1.5, autoAlpha: 0, duration: 0.5 }, "press")
        .addLabel("open", "press+=0.08")
        .set("#kebab", { attr: { "aria-expanded": "true" } }, "open")
        .to("#menu", { autoAlpha: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(1.6)" }, "open")
        .to(items, { autoAlpha: 1, y: 0, duration: 0.3, stagger: 0.05 }, "open+=0.06")
        // cursor glides onto the first item, highlight travels down the list
        .to("#cursor", { x: () => centre(items[0], -30).x, y: () => centre(items[0], 0, 4).y, duration: 0.5, ease: "power2.inOut" }, "open+=0.4")
        .to("#hl", { autoAlpha: 1, duration: 0.2 }, "<0.3")
        .addLabel("scan")
        .to("#hl", { y: rowY(1), duration: 0.28, ease: "power2.inOut" }, "scan+=0.55")
        .to("#cursor", { y: () => centre(items[1], 0, 4).y, duration: 0.28, ease: "power2.inOut" }, "<")
        .to("#hl", { y: rowY(2), duration: 0.28, ease: "power2.inOut" }, "scan+=1.05")
        .to("#cursor", { y: () => centre(items[2], 0, 4).y, duration: 0.28, ease: "power2.inOut" }, "<")
        .to("#hl", { y: rowY(3), duration: 0.28, ease: "power2.inOut" }, "scan+=1.55")
        .to("#cursor", { y: () => centre(items[3], 0, 4).y, duration: 0.28, ease: "power2.inOut" }, "<")
        .add(() => $("#hl").classList.add("danger"), "scan+=1.7")
        .addLabel("close", "scan+=2.7")
        .to("#menu", { autoAlpha: 0, scale: 0.94, y: -6, duration: 0.22, ease: "power2.in" }, "close")
        .to("#cursor", { autoAlpha: 0, duration: 0.2 }, "close+=0.05")
        .add(() => { $("#hl").classList.remove("danger"); $("#kebab").setAttribute("aria-expanded", "false"); }, "close+=0.25");
    };
    build();
    return () => { tl && tl.kill(); };
  });

  $("#replay").addEventListener("click", () => { if (tl) tl.restart(true); });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (tl && tl.paused() === false) tl.restart(true); }, 250); });
</script>
</body>
</html>
