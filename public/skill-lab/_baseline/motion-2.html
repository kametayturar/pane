<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropdown menu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px 20px; width: 100%; max-width: 440px; display: flex; align-items: center; justify-content: space-between; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,.04); margin-bottom: 220px; }
  .info .name { font-weight: 600; color: #0f172a; }
  .info .time { font-size: 14px; color: #64748b; }
  .menu-btn { width: 38px; height: 38px; border-radius: 9px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .menu-btn.active { background: #e0f2fe; border-color: #7dd3fc; }
  .menu-btn svg { width: 18px; height: 18px; fill: #475569; }
  .menu {
    position: absolute; top: calc(100% - 6px); right: 14px; width: 220px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 6px;
    box-shadow: 0 14px 34px rgba(15,23,42,.14); opacity: 0; transform: translateY(-8px) scale(.97); transform-origin: top right; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; z-index: 5;
  }
  .menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 14px; color: #1e293b; cursor: pointer; transition: background .12s; }
  .item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: #64748b; }
  .item.hl { background: #f1f5f9; }
  .sep { height: 1px; background: #e2e8f0; margin: 5px 0; }
  .item.danger { color: #dc2626; }
  .item.danger svg { color: #dc2626; }
  .item.danger.hl { background: #fef2f2; }
  .replay { position: fixed; bottom: 20px; left: 20px; padding: 8px 14px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; font-family: inherit; font-size: 13px; cursor: pointer; }
  .replay:hover { background: #f8fafc; }
</style>
</head>
<body>
<div class="card">
  <div class="info">
    <div class="name">Maria Lopez</div>
    <div class="time">Tue 10:30 · Knee rehab</div>
  </div>
  <button class="menu-btn" id="btn" aria-haspopup="menu" aria-expanded="false" aria-label="Appointment actions">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
  </button>
  <div class="menu" id="menu" role="menu">
    <div class="item" role="menuitem"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Reschedule</div>
    <div class="item" role="menuitem"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Duplicate</div>
    <div class="item" role="menuitem"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>Send reminder</div>
    <div class="sep"></div>
    <div class="item danger" role="menuitem"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>Cancel appointment</div>
  </div>
</div>
<button class="replay" id="replay">Replay</button>
<script>
  const btn = document.getElementById('btn'), menu = document.getElementById('menu');
  const items = [...menu.querySelectorAll('.item')];
  let timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  function setOpen(o) { menu.classList.toggle('open', o); btn.classList.toggle('active', o); btn.setAttribute('aria-expanded', o); }
  function hl(i) { items.forEach((el, n) => el.classList.toggle('hl', n === i)); }
  function run() {
    timers.forEach(clearTimeout); timers = [];
    setOpen(false); hl(-1);
    at(800, () => setOpen(true));
    at(1400, () => hl(0));
    at(1900, () => hl(1));
    at(2400, () => hl(2));
    at(2900, () => hl(3));
    at(3800, () => { hl(-1); setOpen(false); });
    at(5200, run);
  }
  document.getElementById('replay').addEventListener('click', run);
  btn.addEventListener('click', () => { timers.forEach(clearTimeout); setOpen(!menu.classList.contains('open')); });
  run();
</script>
</body>
</html>
