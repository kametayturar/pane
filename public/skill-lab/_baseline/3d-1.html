<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidewater – calm scheduling</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #ecfeff 0%, #e0f2fe 55%, #eef2ff 100%); color: #0f172a; overflow-x: hidden; }
  nav { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; padding: 22px 40px; }
  .logo { font-weight: 800; font-size: 21px; color: #0e7490; }
  .nav-r { display: flex; gap: 24px; align-items: center; font-size: 15px; color: #475569; }
  .btn { display: inline-block; padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: 15px; background: #0891b2; color: #fff; text-decoration: none; box-shadow: 0 8px 20px rgba(8,145,178,.3); }
  .btn.ghost { background: rgba(255,255,255,.7); color: #0f172a; box-shadow: none; border: 1px solid #cbd5e1; }
  .hero { position: relative; min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 40px; max-width: 1280px; margin: 0 auto; }
  .copy { position: relative; z-index: 2; padding-top: 40px; }
  .eyebrow { display: inline-block; background: rgba(255,255,255,.75); color: #0e7490; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 18px; }
  h1 { font-size: 56px; line-height: 1.08; letter-spacing: -2px; font-weight: 800; margin-bottom: 18px; }
  p.lead { font-size: 19px; color: #475569; max-width: 480px; margin-bottom: 28px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  #stage { position: relative; height: 80vh; min-height: 460px; min-width: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
  .fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; color: #64748b; }
  @media (max-width: 860px) {
    nav { padding: 18px 20px; } .nav-r a:not(.btn) { display: none; }
    .hero { grid-template-columns: 1fr; padding: 0 20px; padding-top: 80px; }
    h1 { font-size: 38px; }
    #stage { height: 340px; min-height: 0; }
  }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<nav><div class="logo">Tidewater</div><div class="nav-r"><a href="#" style="color:inherit;text-decoration:none">Features</a><a href="#" style="color:inherit;text-decoration:none">Pricing</a><a class="btn" href="#">Start free trial</a></div></nav>
<section class="hero">
  <div class="copy">
    <span class="eyebrow">Scheduling for physiotherapy clinics</span>
    <h1>A calmer way to run your day</h1>
    <p class="lead">Tidewater keeps every appointment in its place, so your team can stop juggling the calendar and start focusing on patients.</p>
    <div class="row"><a class="btn" href="#">Start free trial</a><a class="btn ghost" href="#">See how it works</a></div>
  </div>
  <div id="stage"><div class="fallback" id="fb">3D preview unavailable</div></div>
</section>

<script type="module">
import * as THREE from 'three';

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(8.6, 8, 11.2);
camera.lookAt(0, 0.4, 0);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) { document.getElementById('fb').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb6e3f0, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(5, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8; sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.radius = 6;
scene.add(sun);

// rounded block helper
function roundedBox(w, h, d, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 3 });
  g.rotateX(-Math.PI / 2);
  return g;
}

const group = new THREE.Group();
scene.add(group);

// base plate
const base = new THREE.Mesh(roundedBox(6.4, 0.25, 6.4, 0.35), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }));
base.position.y = -0.25; base.receiveShadow = true; base.castShadow = true;
group.add(base);

const palette = [0x22d3ee, 0x38bdf8, 0x60a5fa, 0x34d399, 0xa5b4fc];
const blocks = [];
const cols = 4, rows = 4, cell = 1.4;
// slots: some tall (long appointments), different colours
const layout = [
  [1,0,2],[0,1,1],[2,1,1],[3,0,1],
  [0,0,1],[1,1,3],[2,0,1],[3,1,2],
  [0,2,2],[1,2,1],[2,2,2],[3,2,1],
  [0,3,1],[1,3,2],[2,3,1],[3,3,3]
];
let i = 0;
for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
  const len = layout[i % layout.length][2]; i++;
  const hgt = 0.25 + len * 0.28;
  const mat = new THREE.MeshStandardMaterial({ color: palette[(r * 2 + c) % palette.length], roughness: 0.35, metalness: 0.05 });
  const m = new THREE.Mesh(roundedBox(1.15, hgt, 1.15, 0.2), mat);
  m.position.set((c - (cols - 1) / 2) * cell, 0, (r - (rows - 1) / 2) * cell);
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  blocks.push({ m, phase: Math.random() * Math.PI * 2, base: m.position.y });
}

// a floating "now" ring that glides slowly
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.06, 16, 64), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.4 }));
ring.rotation.x = Math.PI / 2;
group.add(ring);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  group.rotation.y = t * 0.15;
  group.position.y = Math.sin(t * 0.6) * 0.12;
  blocks.forEach((b, n) => { b.m.position.y = Math.sin(t * 0.8 + b.phase) * 0.06; });
  // ring glides across the grid
  ring.position.x = Math.sin(t * 0.4) * 2.1;
  ring.position.z = Math.cos(t * 0.3) * 2.1;
  ring.position.y = 1.9 + Math.sin(t * 1.2) * 0.1;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
