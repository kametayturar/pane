<!doctype html>
<!-- Tidewater test app (fixture for the skill lab): a signup form and a booking page. It contains a real bug. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidewater – test app</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1d21}
nav{display:flex;gap:16px;padding:14px 24px;background:#fff;border-bottom:1px solid #e5e7eb}
nav a{color:#0f766e;text-decoration:none;font-weight:500}
main{max-width:520px;margin:40px auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;margin-top:14px;font-weight:500}input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;box-sizing:border-box}
.err{color:#b91c1c;font-size:13px;min-height:18px}button{margin-top:18px;padding:11px 18px;border:0;border-radius:8px;background:#0f766e;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.slot{padding:10px;border:1px solid #cbd5e1;border-radius:8px;text-align:center;cursor:pointer}.slot.sel{border-color:#0f766e;background:#ecfdf5}
.ok{background:#ecfdf5;color:#065f46;padding:12px;border-radius:8px;margin-top:16px}
</style></head>
<body>
<nav><a href="#signup">Sign up</a><a href="#book">Book</a></nav>
<main id="view"></main>
<script>
const view = document.getElementById("view")
function signup() {
  view.innerHTML = `<h1>Create your clinic account</h1>
  <form id="f" novalidate>
    <label for="name">Full name</label><input id="name" name="name" autocomplete="name"><div class="err" id="e-name"></div>
    <label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email"><div class="err" id="e-email"></div>
    <label for="pw">Password</label><input id="pw" name="pw" type="password" autocomplete="new-password"><div class="err" id="e-pw"></div>
    <label for="size">Clinic size</label><select id="size"><option>1–3 therapists</option><option>4–10 therapists</option><option>11+ therapists</option></select>
    <button type="submit">Create account</button>
  </form><div id="result"></div>`
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault()
    const email = document.getElementById("email").value.trim()
    const pw = document.getElementById("pw").value
    const name = document.getElementById("name").value.trim()
    let ok = true
    document.getElementById("e-name").textContent = name ? "" : (ok = false, "Enter your name")
    document.getElementById("e-email").textContent = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? "" : (ok = false, "Enter a valid work email")
    document.getElementById("e-pw").textContent = pw.length >= 8 ? "" : (ok = false, "Use at least 8 characters")
    if (ok) document.getElementById("result").innerHTML = `<div class="ok" role="status">Account created for ${email}. Check your inbox.</div>`
  })
}
const SLOTS = [{ id: "s1", time: "09:00" }, { id: "s2", time: "10:30" }, { id: "s3", time: "14:00" }]
let selected
function book() {
  view.innerHTML = `<h1>Book an appointment</h1><p>Dr. Okafor · Tuesday</p>
    <div class="slots">${SLOTS.map((s, i) => `<div class="slot${i === 1 ? " sel" : ""}" data-id="${s.id}">${s.time}</div>`).join("")}</div>
    <button id="book">Book appointment</button><div id="result"></div>`
  view.querySelectorAll(".slot").forEach((el) => el.addEventListener("click", () => {
    view.querySelectorAll(".slot").forEach((x) => x.classList.remove("sel")); el.classList.add("sel")
    selected = SLOTS.find((s) => s.id === el.dataset.id)
  }))
  document.getElementById("book").addEventListener("click", async () => {
    const res = await fetch("/api/book", { method: "POST", body: JSON.stringify({ slot: selected.id }) })
    document.getElementById("result").innerHTML = `<div class="ok">Booked ${selected.time}</div>`
  })
}
function route() { (location.hash === "#book" ? book : signup)() }
addEventListener("hashchange", route); route()
</script>
</body></html>
